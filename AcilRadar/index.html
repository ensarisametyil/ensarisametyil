<!doctype html>
<!--
  index.html
  NE İŞE YARAR : Sayfa iskeleti. Bölümler numaralıdır (0–9).
  NEYİ DEĞİŞTİRMEK İÇİN BURAYA BAK:
    - Metinler BURADA DEĞİL, js/strings.js içindedir: data-text="anahtar".
    - Bölüm sırası ve yeni bölüm: bu dosya. Dinamik içerik: js/ui/*.js
  NOT: Üç bilinçli istisna dışında sayfada sabit metin yoktur:
       (1) <head> içindeki başlık/açıklama/Open Graph (arama motorları ve bağlantı
           önizlemeleri JavaScript çalıştırmaz), (2) <noscript> ve eski tarayıcı yedeği,
       (3) "112’yi Ara" bağlantısının yedek yazısı. tests/ bunların strings.js ile
       AYNI olduğunu denetler.
  NOT: Satır içi betik, satır içi stil ve satır içi olay YOKTUR (docs/GUVENLIK.md › CSP).
-->
<html lang="tr" class="no-js" data-text-size="normal">
<head>
  <!-- ===== 0. HEAD ========================================================== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AcilRadar · Acil servis yoğunluk ve süre tahmini</title>
  <meta name="description" content="Gebze ve çevresindeki devlet hastanesi acil servislerinin tahmini yoğunluğunu ve yol, kayıt, bekleme dâhil tahmini toplam süresini karşılaştırın. Tıbbi karar aracı değildir.">
  <!-- NOT: Yayına alınırken canonical, gerçek ve mutlak adresle değiştirilmelidir (docs/README.md). -->
  <link rel="canonical" href="./">
  <!-- NOT: Arama motorlarında görünmesi istenmiyorsa (ör. pilot dönem) "noindex, nofollow" yapın. -->
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:site_name" content="AcilRadar">
  <meta property="og:title" content="AcilRadar · Acil servis yoğunluk ve süre tahmini">
  <meta property="og:description" content="Gebze ve çevresindeki devlet hastanesi acil servislerinin tahmini yoğunluğunu ve yol, kayıt, bekleme dâhil tahmini toplam süresini karşılaştırın. Tıbbi karar aracı değildir.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0F2F55">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css" media="print">

  <!-- İlk boyamadan önce: ayarlar, metinler, kayıtlı yazı boyutu. -->
  <script src="js/config.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui/topbar.js"></script>
</head>
<body>
  <!-- ===== 1. JAVASCRIPT KAPALI / ESKİ TARAYICI ============================== -->
  <noscript>
    <div class="fallback">
      <p class="fallback__title">Hayati tehlikede hemen 112’yi arayın.</p>
      <p>AcilRadar’ın çalışması için JavaScript gereklidir. Bu sayfadaki bilgiler tahminidir; muayene sırasını triyaj belirler.</p>
      <p><a class="btn btn--danger" href="tel:112">112’yi Ara</a></p>
    </div>
  </noscript>
  <div class="fallback fallback--boot">
    <p class="fallback__title">Hayati tehlikede hemen 112’yi arayın.</p>
    <p>Tarayıcınız AcilRadar’ı çalıştıramadı. Lütfen tarayıcınızı güncelleyin ya da başka bir tarayıcı deneyin.</p>
  </div>

  <a class="skip-link" href="#main" data-text="a11y.skipLink"></a>

  <!-- ===== 2. BANTLAR ======================================================= -->
  <div class="banners js-only">
    <div id="simulation-banner" class="banner banner--simulation" hidden>
      <div class="container banner__inner">
        <span class="banner__tag" data-text="banner.simulationTag"></span>
        <span data-text="banner.simulation"></span>
      </div>
    </div>
    <div id="offline-banner" class="banner banner--offline" role="status" hidden>
      <div class="container banner__inner">
        <span data-icon="offline"></span>
        <span data-text="banner.offline"></span>
      </div>
    </div>
    <div id="notice-banner" class="banner banner--notice" role="status" hidden>
      <div class="container banner__inner">
        <span data-icon="info"></span>
        <strong id="notice-label"></strong>
        <span id="notice-text"></span>
      </div>
    </div>
  </div>

  <!-- ===== 3. ÜST ÇUBUK (yapışkan) =========================================== -->
  <header class="topbar" id="top">
    <div class="container topbar__inner">
      <a class="brand" href="#top" data-text-attr="aria-label:topbar.homeLabel">
        <svg class="brand__logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#0F2F55"/>
          <circle cx="16" cy="16" r="9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity=".35"/>
          <path d="M6 16.5h5l2-4.5 3 9 2.5-5H26" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand__text">
          <span class="brand__name">AcilRadar</span>
          <span class="brand__tagline js-only" data-text="app.tagline"></span>
        </span>
      </a>

      <div class="topbar__size js-only">
        <span class="topbar__size-label" id="text-size-label" data-text="topbar.textSizeLabel"></span>
        <div class="size-group" id="text-size-group" role="group" aria-labelledby="text-size-label">
          <button type="button" class="size-btn" data-size="small" aria-pressed="false" data-text-attr="aria-label:topbar.textSmallLabel"><span aria-hidden="true" data-text="topbar.textSmall"></span></button>
          <button type="button" class="size-btn" data-size="normal" aria-pressed="false" data-text-attr="aria-label:topbar.textNormalLabel"><span aria-hidden="true" data-text="topbar.textNormal"></span></button>
          <button type="button" class="size-btn" data-size="large" aria-pressed="false" data-text-attr="aria-label:topbar.textLargeLabel"><span aria-hidden="true" data-text="topbar.textLarge"></span></button>
        </div>
      </div>

      <a class="btn btn--danger call" href="tel:112" data-text-attr="aria-label:topbar.callLabel">
        <span data-icon="phone"></span>
        <span class="call__long" data-text="topbar.call">112’yi Ara</span>
        <span class="call__short" aria-hidden="true" data-text="topbar.callShort">112</span>
      </a>
    </div>
  </header>

  <main id="main" class="js-only" tabindex="-1">
    <!-- ===== 4. TANITIM ===================================================== -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="container">
        <h1 id="hero-title" class="hero__title" data-text="hero.title"></h1>
        <p class="hero__lead" data-text="hero.lead"></p>
        <ul class="stats" data-text-attr="aria-label:hero.statsLabel">
          <li class="stat">
            <span class="stat__label" data-text="stats.hospitals"></span>
            <span class="stat__value" id="stat-count-value"></span>
            <span class="stat__note" id="stat-count-note"></span>
          </li>
          <li class="stat">
            <span class="stat__label" data-text="stats.leastCrowded"></span>
            <span class="stat__value stat__value--name" id="stat-least-value"></span>
            <span class="stat__note" id="stat-least-note"></span>
          </li>
          <li class="stat">
            <span class="stat__label" data-text="stats.nearest"></span>
            <span class="stat__value stat__value--name" id="stat-nearest-value"></span>
            <span class="stat__note" id="stat-nearest-note"></span>
          </li>
        </ul>
        <p class="disclaimer"><span data-icon="info"></span><span data-text="disclaimer.short"></span></p>
      </div>
    </section>

    <!-- ===== 5. HAYATİ TEHLİKE (varsayılan kapalı, ekranı ENGELLEMEZ) ======== -->
    <section class="container section section--tight" aria-labelledby="emergency-title">
      <div class="emergency">
        <div class="emergency__head">
          <span class="emergency__icon"><span data-icon="alert"></span></span>
          <h2 id="emergency-title" class="emergency__title" data-text="emergency.title"></h2>
          <a class="btn btn--danger" href="tel:112"><span data-icon="phone"></span><span data-text="emergency.call"></span></a>
        </div>
        <button type="button" class="disclosure disclosure--danger" data-disclosure aria-expanded="false" aria-controls="emergency-body">
          <span data-text="emergency.toggle"></span><span data-icon="chevron" class="disclosure__chevron"></span>
        </button>
        <div id="emergency-body" class="emergency__body" hidden>
          <p data-text="emergency.intro"></p>
          <ul class="emergency__list" data-text-list="emergency.symptoms"></ul>
          <p class="emergency__note" data-text="emergency.note"></p>
        </div>
      </div>
    </section>

    <!-- ===== 6. SEÇİMLER (1 · 2 · 3) =========================================== -->
    <section class="container section" aria-labelledby="controls-title">
      <h2 id="controls-title" class="section__title" data-text="controls.title"></h2>
      <form id="controls-form" class="controls" novalidate>
        <fieldset class="step">
          <legend class="step__legend"><span class="step__num" aria-hidden="true">1</span><span data-text="controls.step1"></span></legend>
          <div class="field">
            <label class="field__label" for="district-select" data-text="controls.districtLabel"></label>
            <select id="district-select" class="input" aria-describedby="location-status"></select>
          </div>
          <button type="button" id="locate-button" class="btn btn--secondary btn--block">
            <span data-icon="locate"></span><span data-text="controls.useLocation"></span>
          </button>
          <p id="location-status" class="field-status" role="status"></p>
        </fieldset>

        <fieldset class="step">
          <legend class="step__legend"><span class="step__num" aria-hidden="true">2</span><span data-text="controls.step2"></span></legend>
          <div id="time-group" class="segment segment--stack"></div>
          <p id="time-forecast-note" class="field-hint" data-text="controls.timeForecastNote" hidden></p>
        </fieldset>

        <fieldset class="step">
          <legend class="step__legend"><span class="step__num" aria-hidden="true">3</span><span data-text="controls.step3"></span></legend>
          <div class="field" role="radiogroup" aria-labelledby="sort-label">
            <span class="field__label" id="sort-label" data-text="controls.sortLabel"></span>
            <div id="sort-group" class="segment segment--stack"></div>
          </div>
          <div class="field">
            <label class="field__label" for="search-input" data-text="controls.searchLabel"></label>
            <div class="input-icon">
              <span data-icon="search"></span>
              <input id="search-input" class="input" type="search" autocomplete="off" spellcheck="false" aria-describedby="search-hint">
            </div>
            <p id="search-hint" class="field-hint" data-text="controls.searchHint"></p>
          </div>
          <div class="field" role="group" aria-labelledby="crowding-label">
            <span class="field__label" id="crowding-label" data-text="controls.crowdingLabel"></span>
            <div id="crowding-group" class="chips"></div>
          </div>
          <button type="button" id="child-toggle" class="chip chip--wide" aria-pressed="false">
            <span data-icon="child"></span><span data-text="controls.childOnly"></span>
          </button>
          <button type="button" id="clear-filters" class="btn btn--ghost" hidden><span data-text="controls.clearFilters"></span></button>
          <p class="field-hint" data-text="controls.sortNote"></p>
        </fieldset>
      </form>
    </section>

    <!-- ===== 7. SONUÇLAR: öneri, harita, liste ============================== -->
    <section class="container section" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title" class="section__title" data-text="results.title"></h2>
        <p id="results-status" class="results-head__status"></p>
        <div class="results-head__meta">
          <p id="last-updated" class="field-hint"></p>
          <button type="button" id="refresh-button" class="btn btn--ghost btn--compact">
            <span data-icon="refresh"></span><span data-text="results.refresh"></span>
          </button>
        </div>
      </div>
      <p class="disclaimer disclaimer--compact"><span data-icon="info"></span><span data-text="disclaimer.short"></span></p>

      <div id="error-region" class="error-region" role="alert" hidden></div>
      <div id="pick" class="pick" hidden></div>

      <div class="results">
        <!-- 7a. Harita: mobilde listeden önce ve daraltılabilir; ≥900 px'te sağda yapışkan -->
        <div class="results__map">
          <div id="map-panel" class="map-panel" role="region" aria-labelledby="map-title">
            <div class="map-panel__head">
              <h3 id="map-title" class="map-panel__title" data-text="map.title"></h3>
              <div class="map-panel__actions">
                <button type="button" id="map-fit" class="btn btn--secondary btn--compact"><span data-icon="expand"></span><span data-text="map.fitAll"></span></button>
                <button type="button" id="map-toggle" class="btn btn--ghost btn--compact map-panel__toggle" aria-expanded="true" aria-controls="map-body">
                  <span data-role="label" data-text="map.hide"></span><span data-icon="chevron" class="disclosure__chevron"></span>
                </button>
              </div>
            </div>
            <div id="map-body" class="map-panel__body">
              <div id="map" class="map" data-text-attr="aria-label:map.label">
                <p class="map__loading" data-text="map.loading"></p>
              </div>
              <div class="legend">
                <span class="legend__title" data-text="map.legendTitle"></span>
                <ul class="legend__list">
                  <li><span class="legend__dot legend__dot--low" aria-hidden="true"></span><span data-text="crowding.low"></span></li>
                  <li><span class="legend__dot legend__dot--medium" aria-hidden="true"></span><span data-text="crowding.medium"></span></li>
                  <li><span class="legend__dot legend__dot--high" aria-hidden="true"></span><span data-text="crowding.high"></span></li>
                  <li><span class="legend__dot legend__dot--stale" aria-hidden="true"></span><span data-text="crowding.stale"></span></li>
                  <li><span class="legend__dot legend__dot--origin" aria-hidden="true"></span><span data-text="map.legendOrigin"></span></li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <!-- 7b. Liste -->
        <div class="results__list">
          <div id="results-message" hidden></div>
          <ol id="results-list" class="card-list" aria-busy="true" data-text-attr="aria-label:results.listLabel"></ol>
        </div>
      </div>
    </section>

    <!-- ===== 8. BİLGİ: hesap · kullanım · kaynak · sorumluluk · gizlilik ===== -->
    <section class="container section" aria-labelledby="formula-title">
      <div class="panel">
        <h2 id="formula-title" class="panel__title">
          <button type="button" class="disclosure disclosure--heading" data-disclosure aria-expanded="false" aria-controls="formula-body">
            <span data-icon="calculator"></span><span data-text="info.formulaTitle"></span><span data-icon="chevron" class="disclosure__chevron"></span>
          </button>
        </h2>
        <div id="formula-body" class="panel__body" hidden>
          <p data-text="info.formulaIntro"></p>
          <ol class="formula">
            <li id="formula-travel"></li>
            <li id="formula-registration"></li>
            <li data-text="info.formulaWait"></li>
          </ol>
          <p class="formula__total" data-text="info.formulaTotal"></p>
          <p id="formula-stale"></p>
          <p data-text="info.formulaCrowding"></p>
        </div>
      </div>
    </section>

    <section class="container section" aria-labelledby="howto-title">
      <h2 id="howto-title" class="section__title" data-text="info.howtoTitle"></h2>
      <ol class="howto">
        <li class="howto__item"><span class="howto__num" aria-hidden="true">1</span><h3 class="howto__title" data-text="info.howto1Title"></h3><p data-text="info.howto1Body"></p></li>
        <li class="howto__item"><span class="howto__num" aria-hidden="true">2</span><h3 class="howto__title" data-text="info.howto2Title"></h3><p data-text="info.howto2Body"></p></li>
        <li class="howto__item"><span class="howto__num" aria-hidden="true">3</span><h3 class="howto__title" data-text="info.howto3Title"></h3><p data-text="info.howto3Body"></p></li>
      </ol>
    </section>

    <section class="container section info-grid">
      <div class="panel" aria-labelledby="source-title">
        <h2 id="source-title" class="panel__title"><span data-icon="database"></span><span data-text="info.sourceTitle"></span></h2>
        <p id="source-text"></p>
        <p class="field-hint" data-text="info.sourceCommon"></p>
      </div>
      <div class="panel" aria-labelledby="privacy-title">
        <h2 id="privacy-title" class="panel__title"><span data-icon="shield"></span><span data-text="info.privacyTitle"></span></h2>
        <ul class="bullets" data-text-list="info.privacy"></ul>
      </div>
      <div class="panel panel--wide" aria-labelledby="legal-title">
        <h2 id="legal-title" class="panel__title"><span data-icon="info"></span><span data-text="info.legalTitle"></span></h2>
        <ul class="bullets" data-text-list="info.legal"></ul>
      </div>
    </section>
  </main>

  <!-- ===== 9. ALTBİLGİ ======================================================= -->
  <footer class="footer js-only">
    <div class="container footer__grid">
      <div>
        <p class="footer__name">AcilRadar</p>
        <p class="footer__about" data-text="footer.about"></p>
      </div>
      <nav aria-labelledby="footer-nav-title">
        <p class="footer__heading" id="footer-nav-title" data-text="footer.navTitle"></p>
        <ul class="footer__links">
          <li><a href="#controls-title" data-text="controls.title"></a></li>
          <li><a href="#results-title" data-text="results.title"></a></li>
          <li><a href="#formula-title" data-text="info.formulaTitle"></a></li>
          <li><a href="#source-title" data-text="info.sourceTitle"></a></li>
          <li><a href="#privacy-title" data-text="info.privacyTitle"></a></li>
        </ul>
      </nav>
      <div class="footer__emergency">
        <p class="footer__heading" data-text="footer.emergencyTitle"></p>
        <p data-text="footer.emergencyBody"></p>
        <a class="btn btn--danger" href="tel:112"><span data-icon="phone"></span><span data-text="emergency.call"></span></a>
      </div>
    </div>
    <div class="footer__bottom">
      <div class="container footer__bottom-inner">
        <p id="footer-copyright"></p>
        <p data-text="disclaimer.short"></p>
        <p data-text="footer.mapData"></p>
        <a href="#top" data-text="footer.backToTop"></a>
      </div>
    </div>
  </footer>

  <div id="live-region" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Sıra önemlidir; type="module" KULLANILMAZ (file:// ile de açılsın diye). -->
  <script src="js/ui/dom.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/api.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/ui/states.js"></script>
  <script src="js/ui/hero.js"></script>
  <script src="js/ui/info.js"></script>
  <script src="js/ui/controls.js"></script>
  <script src="js/ui/cards.js"></script>
  <script src="js/ui/pick.js"></script>
  <script src="js/ui/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
