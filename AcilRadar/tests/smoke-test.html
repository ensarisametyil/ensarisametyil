<!doctype html>
<!--
  DOSYA ADI    : tests/smoke-test.html
  NE İŞE YARAR : Tarayıcıda açılınca saf fonksiyonları (calc.js), yanıt doğrulamayı
                 (api.js), metin yardımcılarını (strings.js), XSS güvenliğini ve metin
                 anahtarlarını denetleyen küçük test sayfası. Derleme/npm gerekmez.
  NEYİ ALIR    : ../js/*.js (uygulamanın kendi dosyaları).
  NEYİ VERİR   : Yeşil (geçti) / kırmızı (kaldı) test listesi.
  NEYİ DEĞİŞTİRMEK İÇİN BURAYA BAK:
    - Yeni test eklemek: aşağıda test('açıklama', function () { ... }) yazın.
  NOT: "Kaynak dosya taraması" testleri dosyaları fetch ile okur; file:// ile
       açıldığında tarayıcı buna izin vermez, bu testler "atlandı" görünür.
       Hepsini çalıştırmak için klasörü basit bir sunucuyla açın (README › Kurulum).
  NOT: Bu sayfa geliştiriciler içindir; metinleri bilerek burada yazılıdır.
-->
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcilRadar · Duman testi</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body { padding: 24px; }
    .summary { font-size: 1.4rem; font-weight: 800; margin: 16px 0; }
    .pass { color: var(--c-low-fg); }
    .fail { color: var(--c-high-fg); }
    .skip { color: var(--c-medium-fg); }
    #results { list-style: none; padding: 0; display: grid; gap: 6px; }
    #results li { padding: 8px 12px; border-radius: 8px; background: var(--c-surface); border: 1px solid var(--c-border); }
    #results small { display: block; color: var(--c-text-muted); white-space: pre-wrap; }
    #sandbox { position: absolute; left: -10000px; width: 400px; }
  </style>
</head>
<body>
  <h1>AcilRadar · Duman testi</h1>
  <p class="summary" id="summary">Çalışıyor…</p>
  <ol id="results"></ol>
  <div id="sandbox"><ol id="sandbox-list"></ol><div id="sandbox-rec"></div></div>

  <script src="../js/config.js"></script>
  <script src="../js/strings.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/ui/dom.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/calc.js"></script>
  <script src="../js/ui/states.js"></script>
  <script src="../js/ui/cards.js"></script>
  <script>
  (function () {
    'use strict';
    var AR = window.AcilRadar;
    var cfg = AR.config;
    var calc = AR.calc;
    var tests = [];
    var NOW = Date.parse('2026-10-06T13:35:00+03:00');

    function test(name, fn) { tests.push({ name: name, fn: fn }); }
    function assert(condition, message) { if (!condition) throw new Error(message || 'Beklenen koşul sağlanmadı'); }
    function equal(actual, expected, message) {
      var a = JSON.stringify(actual), e = JSON.stringify(expected);
      if (a !== e) throw new Error((message || 'Eşit değil') + '\n  beklenen: ' + e + '\n  gelen:    ' + a);
    }
    function Skip(message) { this.message = message; }

    function hospital(over) {
      return Object.assign({
        hospitalId: 'h1', name: 'Örnek Hastane A', district: 'Gebze', lat: 40.80, lng: 29.43,
        childER: false, occupancyPercent: 50, crowdingLevel: 'medium',
        greenWaiting: 10, yellowWaiting: 2, activePhysicians: 4,
        estimatedGreenWaitMinutes: [20, 30], estimatedYellowWaitMinutes: [5, 10],
        updatedAt: new Date(NOW - 5 * 60000).toISOString(), isForecast: false, dataSource: 'simulated'
      }, over || {});
    }
    var ORIGIN = { lat: 40.8028, lng: 29.4307 };
    var NO_FILTERS = function () { return { query: '', childOnly: false, levels: new Set(), favoritesOnly: false }; };

    /* ---- calc.js ---------------------------------------------------- */
    test('haversineKm: Gebze–Darıca arası ~5,9 km (kuş uçuşu)', function () {
      var km = calc.haversineKm({ lat: 40.8028, lng: 29.4307 }, { lat: 40.7694, lng: 29.3753 });
      assert(km > 5.5 && km < 6.3, 'gelen: ' + km);
      equal(calc.haversineKm(ORIGIN, ORIGIN), 0);
    });
    test('estimateTravelMinutes: en az MIN_TRAVEL_MINUTES ve trafik payı', function () {
      equal(calc.estimateTravelMinutes(0, cfg.TRAVEL), [cfg.TRAVEL.MIN_TRAVEL_MINUTES, Math.round(cfg.TRAVEL.MIN_TRAVEL_MINUTES * cfg.TRAVEL.TRAFFIC_FACTOR_MAX)]);
      var t = calc.estimateTravelMinutes(35, { ROAD_FACTOR: 1, AVERAGE_SPEED_KMH: 35, TRAFFIC_FACTOR_MAX: 1.5, MIN_TRAVEL_MINUTES: 2 });
      equal(t, [60, 90]);
    });
    test('addRanges: alt ve üst sınırlar ayrı toplanır', function () {
      equal(calc.addRanges([1, 2], [3, 4], [10, 20]), [14, 26]);
    });
    test('isStale: eşik ve okunamayan tarih', function () {
      assert(!calc.isStale(NOW - 30 * 60000, NOW, 30), '30 dk tam sınırda eski sayılmamalı');
      assert(calc.isStale(NOW - 31 * 60000, NOW, 30), '31 dk eski sayılmalı');
      assert(calc.isStale(null, NOW, 30), 'tarih yoksa eski sayılmalı');
    });
    test('buildRow: toplam = yol + kayıt + bekleme', function () {
      var row = calc.buildRow(hospital(), ORIGIN, NOW, cfg);
      equal(row.totalMinutes, calc.addRanges(row.travelMinutes, cfg.REGISTRATION_MINUTES, [20, 30]));
      assert(!row.isStale);
    });
    test('buildRow: eski veride süre GİZLİ (null)', function () {
      var row = calc.buildRow(hospital({ updatedAt: new Date(NOW - (cfg.STALE_AFTER_MINUTES + 1) * 60000).toISOString() }), ORIGIN, NOW, cfg);
      assert(row.isStale);
      equal(row.totalMinutes, null);
      equal(row.waitMinutes, null);
    });
    test('normalizeForSearch: Türkçe harfler katlanır', function () {
      equal(calc.normalizeForSearch('  ÇAYIROVA  Şube '), 'cayirova sube');
      equal(calc.normalizeForSearch('İstanbul'), 'istanbul');
    });

    function sampleRows() {
      return calc.buildRows([
        hospital({ hospitalId: 'a', name: 'Örnek A', district: 'Çayırova', lat: 40.83, lng: 29.37, crowdingLevel: 'high', occupancyPercent: 90, estimatedGreenWaitMinutes: [80, 100] }),
        hospital({ hospitalId: 'b', name: 'Örnek B', childER: true, crowdingLevel: 'low', occupancyPercent: 30, estimatedGreenWaitMinutes: [10, 15] }),
        hospital({ hospitalId: 'c', name: 'Örnek C', lat: 40.80, lng: 29.43, updatedAt: new Date(NOW - 120 * 60000).toISOString() }),
        hospital({ hospitalId: 'd', name: 'Örnek D', lat: 40.95, lng: 29.60, crowdingLevel: 'medium', occupancyPercent: 60, estimatedGreenWaitMinutes: [10, 15] })
      ], ORIGIN, NOW, cfg);
    }

    test('filterRows: arama (aksansız), çocuk acili, favoriler', function () {
      var rows = sampleRows();
      var f = NO_FILTERS(); f.query = 'cayirova';
      equal(calc.filterRows(rows, f, new Set()).map(function (r) { return r.id; }), ['a']);
      f = NO_FILTERS(); f.childOnly = true;
      equal(calc.filterRows(rows, f, new Set()).map(function (r) { return r.id; }), ['b']);
      f = NO_FILTERS(); f.favoritesOnly = true;
      equal(calc.filterRows(rows, f, new Set(['d'])).map(function (r) { return r.id; }), ['d']);
    });
    test('filterRows: yoğunluk filtresi eski veriyi dışarıda bırakır', function () {
      var f = NO_FILTERS(); f.levels = new Set(['medium']);
      equal(calc.filterRows(sampleRows(), f, new Set()).map(function (r) { return r.id; }), ['d']);
    });
    test('sortRows(total): en kısa toplam önce, eski veri en sonda; girdi değişmez', function () {
      var rows = sampleRows();
      var before = rows.map(function (r) { return r.id; });
      var sorted = calc.sortRows(rows, 'total').map(function (r) { return r.id; });
      equal(sorted[0], 'b');
      equal(sorted[sorted.length - 1], 'c');
      equal(rows.map(function (r) { return r.id; }), before, 'girdi dizisi değişmemeli');
    });
    test('sortRows(crowding) ve sortRows(distance)', function () {
      var rows = sampleRows();
      var byCrowd = calc.sortRows(rows, 'crowding').map(function (r) { return r.id; });
      equal(byCrowd, ['b', 'd', 'a', 'c']);
      var byDist = calc.sortRows(rows, 'distance');
      for (var i = 1; i < byDist.length; i += 1) assert(byDist[i - 1].distanceKm <= byDist[i].distanceKm, 'mesafe sırası bozuk');
    });
    test('pickRecommendation: eski veriyi önermez; hiç güncel yoksa null', function () {
      equal(calc.pickRecommendation(sampleRows()).id, 'b');
      var staleOnly = sampleRows().filter(function (r) { return r.isStale; });
      equal(calc.pickRecommendation(staleOnly), null);
    });
    test('summarize: sayı, en az yoğun (güncel), en yakın', function () {
      var s = calc.summarize(sampleRows());
      equal(s.count, 4);
      equal(s.leastCrowded.id, 'b');
      assert(s.nearest !== null);
      equal(calc.summarize([]).nearest, null);
    });
    test('buildDirectionsUrl: yalnız hedef koordinat, kullanıcı konumu yok', function () {
      var url = calc.buildDirectionsUrl(cfg.DIRECTIONS_URL_TEMPLATE, 40.8, 29.4);
      assert(url.indexOf('40.8') !== -1 && url.indexOf('29.4') !== -1, url);
      assert(url.indexOf('origin') === -1, 'başlangıç noktası eklenmemeli');
    });

    /* ---- api.js ------------------------------------------------------ */
    test('parseResponse: yeni biçim { meta, hospitals }', function () {
      var res = AR.api.parseResponse({ meta: { generatedAt: '2026-10-06T13:35:00+03:00', dataSource: 'simulated' }, hospitals: [hospital()] });
      equal(res.hospitals.length, 1);
      assert(res.isSimulated, 'simülasyon algılanmalı');
      equal(res.generatedAt, '2026-10-06T13:35:00+03:00');
    });
    test('parseResponse: eski biçim { hospitals } da çalışır; bilinmeyen alanlar yok sayılır', function () {
      var res = AR.api.parseResponse({ hospitals: [hospital({ dataSource: 'hospital', futureField: 123 })], extra: true });
      equal(res.hospitals.length, 1);
      assert(!res.isSimulated, 'gerçek veri simülasyon sayılmamalı');
      assert(!('futureField' in res.hospitals[0]), 'bilinmeyen alan taşınmamalı');
    });
    test('parseResponse: eksik alanlı kayıt atlanır, geçerliler kalır', function () {
      var bad = hospital({ hospitalId: 'x' }); delete bad.lat;
      var warn = console.warn; var logged = '';
      console.warn = function (msg) { logged += msg; };
      try {
        var res = AR.api.parseResponse({ hospitals: [bad, hospital({ hospitalId: 'ok' })] });
        equal(res.hospitals.map(function (h) { return h.hospitalId; }), ['ok']);
        assert(logged.indexOf('lat') !== -1, 'konsola eksik alan adı yazılmalı');
      } finally { console.warn = warn; }
    });
    test('parseResponse: yanlış biçimde Türkçe ApiError fırlatır', function () {
      var err = console.error; console.error = function () {};
      try {
        AR.api.parseResponse({ results: [] });
        throw new Error('hata fırlatılmalıydı');
      } catch (e) {
        assert(e instanceof AR.api.ApiError, 'ApiError beklenirdi: ' + e.message);
        equal(e.message, AR.text('error.invalidShape'));
      } finally { console.error = err; }
    });
    test('parseResponse: kayıtların hiçbiri geçerli değilse hata', function () {
      var warn = console.warn; console.warn = function () {};
      try {
        AR.api.parseResponse({ hospitals: [{ name: 'eksik' }] });
        throw new Error('hata fırlatılmalıydı');
      } catch (e) {
        equal(e.message, AR.text('error.noValidHospital'));
      } finally { console.warn = warn; }
    });
    test('buildUrl: yalnız ?at= eklenir (konum yok)', function () {
      var url = new URL(AR.api.buildUrl('2h'));
      equal(Array.from(url.searchParams.keys()), ['at']);
      equal(url.searchParams.get('at'), '2h');
    });
    test('mock-data: üretilen yanıt sözleşmeye uyar, adlar "Örnek" ile başlar', function () {
      var res = AR.api.parseResponse(JSON.parse(JSON.stringify(AR.mock.buildBody('now', NOW))));
      assert(res.hospitals.length > 0);
      assert(res.isSimulated);
      res.hospitals.forEach(function (h) { assert(h.name.indexOf('Örnek') === 0, h.name); });
    });

    /* ---- strings.js ---------------------------------------------------- */
    test('text(): yer tutucular dolar, eksik anahtar anahtarın kendisini döndürür', function () {
      equal(AR.text('unit.minutesRange', { min: 10, max: 20 }), '10–20 dk.');
      var warn = console.warn; console.warn = function () {};
      try { equal(AR.text('yok.boyle.bir.anahtar'), 'yok.boyle.bir.anahtar'); }
      finally { console.warn = warn; AR.missingTextKeys.delete('yok.boyle.bir.anahtar'); }
    });
    test('format: tr-TR sayı, yüzde, km, aralık', function () {
      equal(AR.format.km(3.42), '3,4 km');
      equal(AR.format.percent(62), '%62');
      equal(AR.format.minutesRange([15, 15]), '15 dk.');
      equal(AR.format.number(1234), '1.234');
      equal(AR.format.relative(new Date(NOW - 5 * 60000), NOW), '5 dakika önce');
    });
    test('STRINGS: boş metin yok', function () {
      var empty = [];
      (function walk(node, path) {
        Object.keys(node).forEach(function (k) {
          var v = node[k], p = path ? path + '.' + k : k;
          if (typeof v === 'string' && v.trim() === '') empty.push(p);
          else if (v && typeof v === 'object') walk(v, p);
        });
      })(AR.STRINGS, '');
      equal(empty, []);
    });
    test('Her ilçe, zaman, sıralama ve yoğunluk için metin var', function () {
      cfg.DISTRICTS.forEach(function (d) { assert(AR.hasText('districts.' + d.id), d.id); });
      cfg.TIME_SLOTS.forEach(function (t) { assert(AR.hasText('time.' + t), t); });
      cfg.SORT_KEYS.forEach(function (s) { assert(AR.hasText('sort.' + s), s); });
      cfg.CROWDING_LEVELS.concat(['stale']).forEach(function (c) { assert(AR.hasText('crowding.' + c), c); });
      cfg.DATA_SOURCES.concat(['unknown']).forEach(function (s) { assert(AR.hasText('source.' + s), s); });
    });

    /* ---- Güvenlik ve çizim -------------------------------------------- */
    test('escapeHtml: tehlikeli karakterler kaçışlanır', function () {
      equal(AR.dom.escapeHtml('<img src=x onerror="a()">&\''), '&lt;img src=x onerror=&quot;a()&quot;&gt;&amp;&#39;');
    });
    function ctx() {
      return { favorites: new Set(['h1']), expandedIds: new Set(['h1']), features: cfg.FEATURES, nowMs: NOW,
        highlightedId: null, directionsTemplate: cfg.DIRECTIONS_URL_TEMPLATE, registrationMinutes: cfg.REGISTRATION_MINUTES,
        mapAvailable: true, animate: false, maxStagger: 8 };
    }
    test('XSS: sunucudan gelen ad HTML olarak yorumlanmaz', function () {
      var evil = '<img src=x onerror="window.__xss=1"><script>window.__xss=1<\/script>';
      var rows = calc.buildRows([hospital({ name: evil, district: '<b>ilçe</b>' })], ORIGIN, NOW, cfg);
      var list = document.getElementById('sandbox-list');
      AR.ui.cards.renderList(list, rows, ctx());
      AR.ui.cards.renderRecommendation(document.getElementById('sandbox-rec'), rows[0], 1, ctx());
      equal(document.querySelectorAll('#sandbox img, #sandbox script, #sandbox b').length, 0, 'HTML öğesi oluşmamalı');
      assert(list.textContent.indexOf('<img') !== -1, 'ad düz metin olarak görünmeli');
      assert(!window.__xss, 'betik çalışmamalı');
    });
    test('Kart: güncel veride aralık + "tahmini" etiketi; eski veride süre yok', function () {
      var rows = calc.buildRows([hospital(), hospital({ hospitalId: 'old', updatedAt: new Date(NOW - 999 * 60000).toISOString() })], ORIGIN, NOW, cfg);
      var list = document.getElementById('sandbox-list');
      AR.ui.cards.renderList(list, rows, ctx());
      var cards = list.querySelectorAll('.card');
      assert(cards[0].querySelector('.total__value').textContent.indexOf('–') !== -1, 'aralık beklenir');
      assert(cards[0].textContent.indexOf(AR.text('card.totalLabel')) !== -1);
      assert(cards[1].querySelector('.total') === null && cards[1].querySelector('.ring') === null, 'eski veride süre/halka gizli');
      assert(cards[1].textContent.indexOf(AR.text('card.staleTitle')) !== -1);
      assert(cards[0].querySelector('.badge .icon') && cards[0].querySelector('.badge span').textContent, 'rozette simge + yazı');
    });
    test('Çizimde kullanılan tüm metin anahtarları strings.js içinde var', function () {
      var rows = calc.buildRows(AR.api.parseResponse(AR.mock.buildBody('2h', NOW)).hospitals, ORIGIN, NOW, cfg);
      AR.ui.cards.renderList(document.getElementById('sandbox-list'), rows, ctx());
      AR.ui.states.renderEmpty(document.getElementById('sandbox-rec'), 'noMatch', function () {});
      AR.ui.states.renderError(document.getElementById('sandbox-rec'), { message: 'x', detail: 'y' }, true, function () {});
      equal(Array.from(AR.missingTextKeys), []);
    });

    /* ---- storage.js ---------------------------------------------------- */
    test('storage: localStorage hata verse de çalışır (bellek yedeği)', function () {
      var proto = Object.getPrototypeOf(window.localStorage);
      var get = proto.getItem, set = proto.setItem;
      proto.getItem = function () { throw new Error('engelli'); };
      proto.setItem = function () { throw new Error('engelli'); };
      try {
        AR.storage.savePrefs({ theme: 'dark', textSize: 'bogus' });
        var prefs = AR.storage.getPrefs();
        equal(prefs.theme, 'dark');
        equal(prefs.textSize, cfg.DEFAULT_TEXT_SIZE, 'geçersiz değer kaydedilmemeli');
      } finally { proto.getItem = get; proto.setItem = set; AR.storage.clearAll(); }
    });

    /* ---- Kaynak dosya taraması (yalnız http(s) ile) ------------------- */
    var JS_FILES = ['config.js', 'strings.js', 'storage.js', 'api.js', 'mock-data.js', 'calc.js', 'app.js',
      'ui/dom.js', 'ui/header.js', 'ui/summary.js', 'ui/controls.js', 'ui/cards.js', 'ui/map.js', 'ui/states.js'];

    function fetchText(path) {
      if (location.protocol === 'file:') throw new Skip('file:// ile dosya okunamaz; sunucuyla açın.');
      return fetch(path, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(path + ' ' + r.status); return r.text(); });
    }
    function stripComments(src) {
      return src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '').replace(/\s\/\/\s.*$/gm, '');
    }

    test('index.html: data-text anahtarlarının hepsi strings.js içinde', function () {
      return fetchText('../index.html').then(function (source) {
        var html = source.replace(/<!--[\s\S]*?-->/g, '');
        var keys = [], re = /data-text(?:-list)?="([^"]+)"/g, m;
        while ((m = re.exec(html))) keys.push(m[1]);
        re = /data-text-attr="([^"]+)"/g;
        while ((m = re.exec(html))) m[1].split(';').forEach(function (p) { keys.push(p.split(':')[1].trim()); });
        var missing = keys.filter(function (k) { return !AR.hasText(k); });
        assert(keys.length > 50, 'beklenenden az anahtar: ' + keys.length);
        equal(missing, []);
      });
    });
    test("JS: text('…') ile çağrılan anahtarların hepsi strings.js içinde", function () {
      return Promise.all(JS_FILES.map(function (f) { return fetchText('../js/' + f); })).then(function (sources) {
        // Yalnız tam anahtarlar: text('a.b') ya da text('a.b', {...}); 'a.' + x gibi birleştirmeler sayılmaz.
        var missing = [], re = /\btext(?:List)?\('([A-Za-z0-9_.]+)'\s*[,)]/g, m;
        sources.map(stripComments).forEach(function (src) { while ((m = re.exec(src))) if (!AR.hasText(m[1])) missing.push(m[1]); });
        equal(missing, []);
      });
    });
    test('JS: strings.js ve mock-data.js dışında gömülü Türkçe metin yok', function () {
      var allowed = ['strings.js', 'mock-data.js'];
      var files = JS_FILES.filter(function (f) { return allowed.indexOf(f) === -1; });
      return Promise.all(files.map(function (f) { return fetchText('../js/' + f); })).then(function (sources) {
        var found = [];
        sources.forEach(function (src, i) {
          var literals = stripComments(src).match(/'[^'\n]*'|"[^"\n]*"|`[^`]*`/g) || [];
          literals.forEach(function (lit) { if (/[çğıöşüÇĞİÖŞÜ]/.test(lit)) found.push(files[i] + ': ' + lit); });
        });
        equal(found, []);
      });
    });

    /* ---- Çalıştırıcı ---------------------------------------------------- */
    function report(t, status, detail) {
      var li = document.createElement('li');
      li.className = status;
      li.textContent = (status === 'pass' ? '✔ ' : status === 'skip' ? '○ ' : '✘ ') + t.name;
      if (detail) { var s = document.createElement('small'); s.textContent = detail; li.appendChild(s); }
      document.getElementById('results').appendChild(li);
    }
    (async function run() {
      var counts = { pass: 0, fail: 0, skip: 0 };
      for (var i = 0; i < tests.length; i += 1) {
        var t = tests[i];
        try { await t.fn(); counts.pass += 1; report(t, 'pass'); }
        catch (e) {
          if (e instanceof Skip) { counts.skip += 1; report(t, 'skip', 'Atlandı: ' + e.message); }
          else { counts.fail += 1; report(t, 'fail', e.message); }
        }
      }
      var summary = document.getElementById('summary');
      summary.className = 'summary ' + (counts.fail ? 'fail' : 'pass');
      summary.textContent = counts.pass + ' geçti · ' + counts.fail + ' kaldı · ' + counts.skip + ' atlandı';
      document.body.dataset.done = counts.fail ? 'fail' : 'pass';
    })();
  })();
  </script>
</body>
</html>
