server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build hashes filenames (index-XXXX.js) so these can be cached forever; index.html
    # itself must never be cached, or a redeploy won't be picked up by returning visitors.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: any path that isn't a real file falls back to index.html so client-side
    # routes (e.g. /assistant/:cvId, /history/:id) work on a hard refresh or direct URL entry —
    # the backend is a separate origin (VITE_API_BASE_URL), this container never proxies /api.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
